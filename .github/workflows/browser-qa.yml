name: Ladder7 Browser QA

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

# Superseded design commits should not compete to install Chromium on runners.
concurrency:
  group: ladder7-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser automation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ladder7-preview.log 2>&1 &
          for i in $(seq 1 40); do if curl --fail -s http://127.0.0.1:4173/ > /dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/ladder7-preview.log
          exit 1
      - name: Desktop, mobile and reduced-motion smoke
        run: node scripts/browser-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder7-visual-QA
          path: screenshots/
          if-no-files-found: ignore
